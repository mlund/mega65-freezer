# A plain-HTTP mirror of files.mega65.org, which is what FILEHOST fetches
# through: the machine has no TLS and upstream serves nothing without it.
#
# Two jobs, and only two.  Carry the bytes without encryption, and root the
# catalogue's locations so the tool can ask for them: upstream states each one
# as "../files/x/name.d81", relative to the /html/ page it is written for, and
# a location that begins "../" is not a request path.  Dropping the two dots
# is the whole rewrite -- FILEHOST takes a location with no scheme as a path
# already, and throws away the host of one that has a scheme, so the mirror's
# own name never reaches the wire.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 64; }

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # An 800KB image must start moving before it has all arrived: the tool
    # draws progress as it goes and gives up after eight seconds of silence.
    proxy_buffering off;
    proxy_read_timeout 120s;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    server {
        # 8080, not 80: the image runs nginx as uid 101, which may not have a
        # port below 1024.  The host publishes it on 80 so that a bare address
        # reaches it and no port has to be typed at the machine.
        listen 8080;
        server_name _;

        # The machine sends HTTP/1.0 and nginx answers in kind, which cannot
        # chunk -- and chunked is the one framing the tool's reader does not
        # understand.
        set $upstream "files.mega65.org";

        # Everything but the catalogue, byte for byte.  An image must arrive
        # exactly as upstream holds it, and keeps its Content-Length.
        location / {
            proxy_pass https://$upstream;
            proxy_set_header Host $upstream;
            proxy_set_header Accept-Encoding identity;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_hide_header Set-Cookie;
        }

        # The catalogue, and the only place a rewrite belongs.
        location /php/ {
            proxy_pass https://$upstream;
            proxy_set_header Host $upstream;
            # Identity, or the rewrite below would be looking at gzip.
            proxy_set_header Accept-Encoding identity;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;

            # Upstream escapes its slashes, so the bytes on the wire read
            # `..\/files\/`; leaving `\/files\/` is what the transcoder
            # unescapes to `/files/`.  The unescaped spelling is listed too,
            # against the day upstream stops escaping.
            sub_filter_types application/json text/html text/plain;
            sub_filter '..\/' '\/';
            sub_filter '../' '/';
            sub_filter_once off;
        }
    }
}
